<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Simulator</title>

<style>
:root {
    --bg: #f4f4f4;
    --panel: #ffffff;
    --panel-alt: #fafafa;
    --text: #222;
    --heading: #333;
    --border: #ccc;
    --button: #0078d7;
    --button-hover: #005fa3;
    --result-bg: #eef6ff;
    --result-text: #222;
    --shadow: rgba(0,0,0,.1);
    --pastel-1: #d8f3ff;
    --pastel-2: #e7d9ff;
    --pastel-3: #ffd9e8;
    --grade-gradient: linear-gradient(110deg, #287ca8 0%, #7356a8 42%, #b34f88 72%, #438a73 100%);
    --select-bg: linear-gradient(135deg, rgba(216,243,255,0.9), rgba(231,217,255,0.9));
    --select-border: rgba(108, 90, 197, 0.45);
}

body.dark {
    --bg: #111827;
    --panel: #1f2937;
    --panel-alt: #374151;
    --text: #f3f4f6;
    --heading: #f9fafb;
    --border: #4b5563;
    --button: #60a5fa;
    --button-hover: #3b82f6;
    --result-bg: #0f172a;
    --result-text: #e5e7eb;
    --shadow: rgba(0,0,0,.45);
    --pastel-1: rgba(99, 102, 241, 0.28);
    --pastel-2: rgba(168, 85, 247, 0.28);
    --pastel-3: rgba(244, 114, 182, 0.25);
    --grade-gradient: linear-gradient(110deg, #8ee3ff 0%, #c4a8ff 42%, #ffafd8 72%, #9de8c5 100%);
    --select-bg: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(168,85,247,0.18));
    --select-border: rgba(191, 219, 254, 0.5);
}

body{
    font-family: Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:20px;
    transition:background .25s ease, color .25s ease;
}

.container{
    max-width:100%;
    width:100%;
    margin:auto;
    background:var(--panel);
    color:var(--text);
    padding:35px;
    border-radius:16px;
    box-shadow:0 2px 10px var(--shadow);
}

h1{
    text-align:center;
    color:var(--heading);
    font-size:3rem;
    font-weight:700;
    letter-spacing:0.04em;
    font-family: "Segoe UI", "Trebuchet MS", sans-serif;
    text-transform:uppercase;
    line-height:1.2;
    margin:0 0 20px;
    background:linear-gradient(135deg, #7dd3fc 0%, #c4b5fd 35%, #f9a8d4 65%, #86efac 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 18px rgba(125, 211, 252, 0.35);
    transform:scaleY(1.08);
    filter:saturate(1.2);
}

.section{
    margin:20px 0;
}

select {
    width:100%;
    max-width:340px;
    padding:14px 18px;
    border-radius:16px;
    border:1px solid var(--select-border);
    background:var(--select-bg);
    color:var(--text);
    font-size:16px;
    font-family: "Segoe UI", sans-serif;
    letter-spacing:0.08em;
    text-transform:uppercase;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2), 0 8px 20px rgba(123,97,255,0.12);
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%);
    background-position:calc(100% - 20px) calc(50% - 2px), calc(100% - 15px) calc(50% - 2px);
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    transition:all .25s ease;
}

select option {
    background:#1f2430;
    color:#f3f4f6;
    font-family: "Segoe UI", sans-serif;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:10px;
}

select:hover,
select:focus {
    border-color:rgba(96, 165, 250, 0.8);
    box-shadow:0 0 0 3px rgba(96,165,250,0.18), 0 10px 22px rgba(123,97,255,0.14);
    transform:translateY(-1px);
}

label{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    cursor:pointer;
}

input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    display:grid;
    place-content:center;
    flex:0 0 20px;
    width:20px;
    height:20px;
    margin:0;
    border:1.5px solid var(--border);
    border-radius:6px;
    background:transparent;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease;
}

input[type="checkbox"]::before{
    content:"";
    width:5px;
    height:9px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(45deg) scale(0);
    transition:transform .15s ease;
}

input[type="checkbox"]:checked{
    border-color:var(--button);
    background:var(--button);
    box-shadow:0 2px 7px rgba(0,0,0,.15);
}

input[type="checkbox"]:checked::before{
    transform:rotate(45deg) scale(1);
}

input[type="checkbox"]:focus-visible{
    outline:3px solid rgba(0,120,215,.25);
    outline-offset:2px;
}

input[type="checkbox"]:active{
    transform:scale(.92);
}

.equipment-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
}

.card{
    border:1px solid var(--border);
    padding:10px;
    border-radius:8px;
    background:var(--panel-alt);
}

button{
    background:var(--button);
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:var(--button-hover);
}

.start-day-button{
    display:block;
    margin:20px auto;
    background:#e7d9ff;
    color:#352b4a;
    border-radius:12px;
}

.start-day-button:hover{
    background:#d8c5f5;
}

.result{
    margin-top:20px;
    padding:15px;
    background:var(--result-bg);
    color:var(--result-text);
    border-radius:8px;
}

.grade{
    display:inline-block;
    font-size:24px;
    font-weight:bold;
    font-family:"Baskerville", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    letter-spacing:.02em;
    color:#7356a8;
    background:var(--grade-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 1px rgba(255,255,255,.55)) drop-shadow(0 2px 3px rgba(72,58,120,.2));
}

.theme-toggle{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1000;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:var(--button);
    color:white;
    font-size:24px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
    cursor:pointer;
    transition:transform .2s ease, background .25s ease, box-shadow .2s ease;
}

.theme-toggle:hover{
    transform:translateY(-2px);
    background:var(--button-hover);
    box-shadow:0 8px 20px rgba(0,0,0,.24);
}

@media(max-width:600px){
    .equipment-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Student Equipment Simulator</h1>

<div class="section">
<h2>Select Academic Level</h2>

<select id="difficulty">
    <option value="junior">Junior</option>
    <option value="senior">Senior</option>
    <option value="graduate">Graduate</option>
</select>

<div id="schedule" class="result" style="display:none;"></div>
</div>

<div class="section">
<h2>Choose Up To 5 Items</h2>

<div class="equipment-grid">

<div class="card">
<label><input type="checkbox" value="Laptop"> Laptop</label>
</div>

<div class="card">
<label><input type="checkbox" value="Charger"> Charger</label>
</div>

<div class="card">
<label><input type="checkbox" value="Notebook"> Notebook</label>
</div>

<div class="card">
<label><input type="checkbox" value="Calculator"> Calculator</label>
</div>

<div class="card">
<label><input type="checkbox" value="Textbook"> Textbook</label>
</div>

<div class="card">
<label><input type="checkbox" value="Water Bottle"> Water Bottle</label>
</div>

<div class="card">
<label><input type="checkbox" value="Flash Drive"> Flash Drive</label>
</div>

<div class="card">
<label><input type="checkbox" value="Research Papers"> Research Papers</label>
</div>

<div class="card">
<label><input type="checkbox" value="Headphones"> Headphones</label>
</div>

<div class="card">
<label><input type="checkbox" value="Presentation Clicker"> Presentation Clicker</label>
</div>

<div class="card">
<label><input type="checkbox" value="Multiport"> Multiport</label>
</div>

<div class="card">
<label><input type="checkbox" value="Storage Expansion"> Storage Expansion</label>
</div>

</div>
</div>

<button class="start-day-button" onclick="playDay()">Start Academic Day</button>

<div id="output" class="result" style="display:none;"></div>

</div>

<button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">🌙</button>

<script>
const themeToggle = document.getElementById("theme-toggle");

function applyTheme(theme) {
    const isDark = theme === "dark";
    document.body.classList.toggle("dark", isDark);
    themeToggle.textContent = isDark ? "☀️" : "🌙";
    themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
}

const savedTheme = localStorage.getItem("theme") || "light";
applyTheme(savedTheme);

themeToggle.addEventListener("click", () => {
    const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
    localStorage.setItem("theme", nextTheme);
    applyTheme(nextTheme);
});

const scenarios = {

junior: {
    events: [
        "Programming Lab",
        "Math Quiz",
        "Study Session",
        "Group Discussion"
    ]
},

senior: {
    events: [
        "Capstone Project Meeting",
        "Technical Presentation",
        "Internship Interview",
        "Research Session"
    ]
},

graduate: {
    events: [
        "Thesis Defense",
        "Research Conference",
        "Publication Review",
        "Grant Proposal Meeting"
    ]
}

};

function renderSchedule(){
    const level = document.getElementById("difficulty").value;
    const events = scenarios[level].events;
    const todayEvents = [];

    while(todayEvents.length < 3){
        const event = events[Math.floor(Math.random()*events.length)];

        if(!todayEvents.includes(event)){
            todayEvents.push(event);
        }
    }

    const schedule = document.getElementById("schedule");
    schedule.style.display = "block";
    schedule.innerHTML = `
<h2>Academic Schedule Guide</h2>

<ul>
${todayEvents.map(event => `<li>${event}</li>`).join("")}
</ul>
`;
}

document.getElementById("difficulty").addEventListener("change", renderSchedule);
renderSchedule();

const itemValues = {
    "Laptop":20,
    "Charger":15,
    "Notebook":10,
    "Calculator":15,
    "Textbook":15,
    "Water Bottle":5,
    "Flash Drive":10,
    "Research Papers":20,
    "Headphones":5,
    "Presentation Clicker":15,
    "Multiport":10,
    "Storage Expansion":15
};

function playDay(){

    const selectedItems = Array.from(
        document.querySelectorAll('input[type="checkbox"]:checked')
    );

    if(selectedItems.length === 0){
        alert("Choose at least one item.");
        return;
    }

    if(selectedItems.length > 5){
        alert("You can only bring 5 items.");
        return;
    }

    let score = 0;

    selectedItems.forEach(item => {
        score += itemValues[item.value];
    });

    score = Math.min(score,100);

    let grade = "";

    if(score >= 90){
        grade = "A";
    }
    else if(score >= 75){
        grade = "B";
    }
    else if(score >= 60){
        grade = "C";
    }
    else{
        grade = "D";
    }

    document.getElementById("output").style.display = "block";

    document.getElementById("output").innerHTML = `
<h3>Equipment Chosen</h3>

<p>${selectedItems.map(i => i.value).join(", ")}</p>

<h3>Preparedness Score</h3>

<p>${score}/100</p>

<p class="grade">Grade Outcome: ${grade}</p>

<p>You only need that?</p>
`;

}
</script>

</body>
</html>
